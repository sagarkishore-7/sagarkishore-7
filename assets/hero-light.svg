<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Sagar Kishore Kumar — Cybersecurity Engineer. Threat Intelligence, Detection Engineering, Cloud Security, Security Automation.">
  <!-- Generated from hero-dark.svg. Regenerate with the sed pipeline in commit history; do not hand-edit. -->
  <title>Sagar Kishore Kumar — Cybersecurity Engineer</title>

  <defs>
    <!-- faint dot grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#dbe4e0"/>
    </pattern>

    <!-- top-left glow -->
    <radialGradient id="glow" cx="18%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#0b7d55" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0"/>
    </radialGradient>

    <!-- sweeping scanline -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a9e6c" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#0a9e6c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a9e6c" stop-opacity="0"/>
    </linearGradient>

    <!-- accent rule under the name -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a9e6c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a9e6c" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0b7d55" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#0b7d55" stop-opacity="0.45"/>
      <stop offset="88%"  stop-color="#0b7d55" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0b7d55" stop-opacity="0"/>
    </linearGradient>

    <path id="wave" fill="none" d="M640,130 L680,130 L692,104 L704,152 L716,130 L760,130 L772,118 L784,140 L796,130 L860,130 L872,96 L884,160 L896,130 L950,130 L962,120 L974,138 L986,130 L1040,130 L1052,110 L1064,146 L1076,130 L1136,130"/>

    <!-- one mask per rotating role; the white rect widens to "type" the text -->
    <mask id="t0"><rect x="64" y="176" height="30" fill="#fff" width="0"><animate attributeName="width" begin="0s"  dur="20s" repeatCount="indefinite" values="0;432;432;0;0" keyTimes="0;0.05;0.2;0.25;1"/></rect></mask>
    <mask id="t1"><rect x="64" y="176" height="30" fill="#fff" width="0"><animate attributeName="width" begin="5s"  dur="20s" repeatCount="indefinite" values="0;504;504;0;0" keyTimes="0;0.05;0.2;0.25;1"/></rect></mask>
    <mask id="t2"><rect x="64" y="176" height="30" fill="#fff" width="0"><animate attributeName="width" begin="10s" dur="20s" repeatCount="indefinite" values="0;468;468;0;0" keyTimes="0;0.05;0.2;0.25;1"/></rect></mask>
    <mask id="t3"><rect x="64" y="176" height="30" fill="#fff" width="0"><animate attributeName="width" begin="15s" dur="20s" repeatCount="indefinite" values="0;312;312;0;0" keyTimes="0;0.05;0.2;0.25;1"/></rect></mask>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; }
    .name { font-size: 44px; font-weight: 700; fill: #08120f; letter-spacing: 1px; }
    .role { font-size: 20px; font-weight: 500; fill: #0a9e6c; }
    .prompt { font-size: 14px; fill: #7c948c; }
    .tag { font-size: 11.5px; fill: #556b64; letter-spacing: 2.4px; }
    .num { font-size: 26px; font-weight: 700; fill: #0a9e6c; }
    .lbl { font-size: 10px; fill: #1b2b26; letter-spacing: 1.4px; }
    .src { font-size: 8.5px; fill: #7c948c; letter-spacing: 1.2px; }
    .loc { font-size: 11px; fill: #556b64; letter-spacing: 1.6px; }

    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    .cursor { animation: blink 1s step-end infinite; }

    @keyframes sweep { 0% { transform: translateY(-90px) } 100% { transform: translateY(400px) } }
    .scanline { animation: sweep 7s linear infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }
    .live { animation: pulse 2s ease-in-out infinite; }

    @keyframes draw { to { stroke-dashoffset: 0 } }
    .trace { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 4s linear infinite; }
  </style>

  <!-- backdrop -->
  <rect width="1200" height="340" fill="#f6f8fa"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect class="scanline" width="1200" height="90" fill="url(#scan)"/>

  <!-- telemetry trace, right side -->
  <g opacity="0.85">
    <!-- xlink:href alongside href for older Safari -->
    <use href="#wave" xlink:href="#wave" stroke="#0b7d55" stroke-opacity="0.30" stroke-width="1.5"/>
    <use href="#wave" xlink:href="#wave" class="trace" stroke="#0a9e6c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="3" fill="#0a9e6c">
      <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#wave" xlink:href="#wave"/></animateMotion>
    </circle>
  </g>

  <!-- status, top right -->
  <g class="mono">
    <circle class="live" cx="1052" cy="52" r="3.5" fill="#0a9e6c"/>
    <text class="loc" x="1066" y="56">SAARBRÜCKEN · DE</text>
  </g>

  <!-- prompt -->
  <text class="mono prompt" x="64" y="60" textLength="272" lengthAdjust="spacing">sagar@sec:~$ ./whoami --profile</text>

  <!-- name -->
  <text class="mono name" x="64" y="132" textLength="520" lengthAdjust="spacing">SAGAR KISHORE KUMAR</text>
  <rect x="64" y="148" width="360" height="2" fill="url(#rule)"/>

  <!-- rotating role, typed one character at a time -->
  <g class="mono role">
    <text x="64" y="198" mask="url(#t0)" textLength="432" lengthAdjust="spacing">Cyber Threat Intelligence Researcher</text>
    <text x="64" y="198" mask="url(#t1)" textLength="504" lengthAdjust="spacing">Detection Engineer · SIEM &amp; Threat Hunting</text>
    <text x="64" y="198" mask="url(#t2)" textLength="468" lengthAdjust="spacing">Security Automation at Production Scale</text>
    <text x="64" y="198" mask="url(#t3)" textLength="312" lengthAdjust="spacing">AI / LLM Security Engineer</text>
  </g>
  <!-- one track for all four roles: separate per-role animates on the same
       attribute all stay active after the first cycle and the last declared
       one wins, which desyncs the cursor from the text -->
  <rect class="cursor" x="64" y="180" width="10" height="22" fill="#0a9e6c">
    <animate attributeName="x" dur="20s" repeatCount="indefinite"
             values="64;496;496;64;568;568;64;532;532;64;376;376;64"
             keyTimes="0;0.05;0.2;0.25;0.3;0.45;0.5;0.55;0.7;0.75;0.8;0.95;1"/>
  </rect>

  <!-- discipline strip -->
  <text class="mono tag" x="64" y="236" textLength="640" lengthAdjust="spacing">THREAT INTELLIGENCE · DETECTION ENGINEERING · CLOUD SECURITY · SECURITY AUTOMATION</text>

  <rect x="0" y="258" width="1200" height="1" fill="url(#hair)"/>

  <!-- impact metrics: each tile names the system it came from -->
  <g class="mono">
    <rect x="278" y="272" width="1" height="44" fill="#dbe4e0"/>
    <rect x="492" y="272" width="1" height="44" fill="#dbe4e0"/>
    <rect x="706" y="272" width="1" height="44" fill="#dbe4e0"/>
    <rect x="920" y="272" width="1" height="44" fill="#dbe4e0"/>

    <text class="num" x="64"  y="296">~4B</text>
    <text class="lbl" x="64"  y="312">EMAILS / WEEK</text>
    <text class="src" x="64"  y="326">1&amp;1 MAIL &amp; MEDIA</text>

    <text class="num" x="302" y="296">3K+</text>
    <text class="lbl" x="302" y="312">CTI INCIDENTS</text>
    <text class="src" x="302" y="326">CTI RESEARCH</text>

    <text class="num" x="516" y="296">90+</text>
    <text class="lbl" x="516" y="312">COUNTRIES</text>
    <text class="src" x="516" y="326">CTI RESEARCH</text>

    <text class="num" x="730" y="296">200+</text>
    <text class="lbl" x="730" y="312">THREAT ACTORS</text>
    <text class="src" x="730" y="326">CTI RESEARCH</text>

    <text class="num" x="944" y="296">227</text>
    <text class="lbl" x="944" y="312">INJECTION TTPs</text>
    <text class="src" x="944" y="326">LLMMAP</text>
  </g>
</svg>
